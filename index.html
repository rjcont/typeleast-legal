<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typeleast Legal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.8;
    color: #333;
    background: #f8f9fa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .container {
    max-width: 480px;
    padding: 48px 32px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    text-align: center;
  }
  h1 { font-size: 24px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
  p { font-size: 15px; color: #888; margin-bottom: 32px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a {
    display: block;
    padding: 14px 24px;
    background: #f8f9fa;
    border: 1px solid #eee;
    border-radius: 8px;
    color: #333;
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    transition: background 0.2s;
  }
  a:hover { background: #eef1f5; }
</style>
</head>
<body>
<div class="container">
  <h1>Typeleast</h1>
  <p>法律文档</p>
  <div class="links">
    <a href="privacy/">隐私政策 Privacy Policy</a>
    <a href="terms/">服务条款 Terms of Service</a>
  </div>
</div>
</body>
</html>
